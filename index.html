<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Application</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #eeeeee;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      margin: 30px 0;
      font-weight: bold;
    }

    .search-box {
      width: 50%;
      margin: 20px auto;
    }

    .search-box input {
      margin-bottom: 15px;
    }

    .search-box button {
      width: 100%;
    }

    .weather-card {
      width: 50%;
      margin: 20px auto;
      background-color: #dbdbdb;
      border-radius: 10px;
      padding: 20px;
      min-height: 150px;
    }
  </style>
</head>

<body>

  <h1 class="display-3 text-primary">🌤️Weather Application</h1>

  <div class="search-box">
    <input type="text" id="cityName" class="form-control" placeholder="Enter city name">
    <button class="btn btn-primary" id="btnDisplay">Display Information</button>
  </div>

  <div class="weather-card">
    <div id="infoWeather"></div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
