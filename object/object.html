<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card p-4 w-50 mx-auto text-center">

        <h1>Calculator</h1>

        <input type="number" id="num1" class="form-control my-3" placeholder="Enter First Number">

        <input type="number" id="num2" class="form-control mb-3" placeholder="Enter Second Number">

        <button class="btn btn-primary m-1" onclick="add()">Add</button>
        <button class="btn btn-success m-1" onclick="subtract()">Subtract</button>
        <button class="btn btn-warning m-1" onclick="multiply()">Multiply</button>
        <button class="btn btn-danger m-1" onclick="divide()">Divide</button>

        <h3 class="mt-4">
            Result: <span id="result">0</span>
        </h3>

    </div>
</div>

<script src="objectAss.js"></script>

</body>
</html>
