<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Application</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }
body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background-image: url("./weather.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

    .weather-container{
      width:100%;
      max-width:500px;
      background:rgba(255,255,255,0.18);
      backdrop-filter:blur(12px);
      border-radius:20px;
      padding:30px;
      box-shadow:0 8px 25px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      color:#fff;
      font-size:35px;
      margin-bottom:25px;
      font-weight:bold;
    }

    .form-control{
      height:50px;
      border-radius:12px;
      border:none;
    }

    .btn{
      height:50px;
      border-radius:12px;
      font-size:18px;
      font-weight:bold;
      background:#0d6efd;
    }

    .btn:hover{
      background:#0b5ed7;
    }

    .weather-card{
      margin-top:25px;
      background:#9cbec7;
      border-radius:15px;
      padding:20px;
      min-height:180px;
      text-align:center;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    #infoWeather img{
      width:80px;
      margin-bottom:10px;
    }

    #infoWeather h2{
      color:#333;
      margin-bottom:10px;
    }

    #infoWeather p{
      margin:6px 0;
      color:#555;
      font-size:17px;
    }
  </style>
</head>

<body>

  <div class="weather-container">

    <h1>🌤️ Weather App</h1>

    <input type="text" id="cityName"
      class="form-control mb-3"
      placeholder="Enter city name">

    <button class="btn btn-primary w-100" id="btnDisplay">
      Search Weather
    </button>

    <div class="weather-card">
      <div id="infoWeather">
        <h2>Welcome 👋</h2>
        <p>Enter a city name to view weather.</p>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
