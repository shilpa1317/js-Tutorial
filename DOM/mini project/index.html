<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Enfield Classic 350</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="product-card">
        <div class="img-section">
            <img id="productImage" src="./image/balckRE.jpg" alt="Product">
        </div>
        <br>
        <div class="product-info">
            <button id="bikbtn">Black</button>
            <h3>ROYAL ENFIELD classic 350</h3>
            <p> 🏍️💨Engine: 349cc air-oil cooled single cylinder.</p>
            <p>⛽Fuel: 75-80 mpg<p>
            <p>⛑️Safety: ⭐⭐⭐⭐</p>
            <br>
            <p>Pick a color:</p>
           <div class="colors">
                <span id="black-color-dot" class="black"></span>
                <span id="brown-color-dot" class="brown"></span>
                <span id="blue-color-dot" class="blue"></span>
            </div>
             <h4> Price: ₹2,24,275.00</h4>
            <button id="cartBtn">Add to cart</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
