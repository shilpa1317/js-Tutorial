<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Assignment Dom</title>
  <style>
    .DarkTheme{
      background-color:black;
      color: white;
    }
    .lightTheme{
      background-color: white;
      color: black;
    }
  </style>
</head>
<body>
  <h1 id="msg">Welcome Student</h1>
  <button id="headingBtn">Change Heading</button>
<script>document.querySelector('#headingBtn').addEventListener("click",()=>{
    document.querySelector('#msg').textContent="Welcome to Js"
})
  
</script>  

<hr>

  <p id="para1">
    Lorem ipsum, dolor sit amet consectetur adipisicing elit.
  </p>

  <button id="redBtn">RED</button>
  <button id="greenBtn">GREEN</button>
  <button id="blueBtn">BLUE</button>

  <script>
    const para = document.querySelector("#para1");

    document.querySelector("#redBtn").addEventListener("click", () => {
      para.style.color = "red";
    });

    document.querySelector("#greenBtn").addEventListener("click", () => {
      para.style.color = "green";
    });

    document.querySelector("#blueBtn").addEventListener("click", () => {
      para.style.color = "blue";
    });
  </script>

<hr>
 
    <p id="para2">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Maxime, nesciunt.</p>
    <button id="showhidebtn">Show /Hide</button>
  
 
  <script>
  let paraElmt =  document.querySelector('#para2');
    document.querySelector('#showhidebtn').addEventListener("click",()=>{if(paraElmt.style.display=="none"){
      paraElmt.style.display="block";
    }else{
      paraElmt.style.display="none";
    }

    });
  </script>
  <hr>
  <h1 id="counter">0</h1>
  <button id="increment">Increment</button>
  <button id="decerement">Decerement</button>
  <button id="reset">Reset</button>
  <script>
    let count=0;
    let counter=document.querySelector('#counter')
    document.querySelector('#increment').addEventListener("click",()=>{
      count++;
      counter.textContent=count;
    })
     document.querySelector('#decerement').addEventListener("click",()=>
     {if(count>0){
      count--;}

      counter.textContent=count;
    })

        document.querySelector('#reset').addEventListener("click",()=>{
      count=0;
      counter.textContent=count;
    })


  </script>
<hr>

<button id="redbtn1">RED</button>
<button id="greenbtn1"> GREEN</button>
<button id="bluebtn1">BLUE</button>
<button id="yellowbtn1">YELLOW</button>
<button id="reset3">RESET</button>
<script>
document.querySelector('#redbtn1').addEventListener("click",()=>{
  document.body.style.backgroundColor="red"
})
document.querySelector('#greenbtn1').addEventListener("click",()=>{
  document.body.style.backgroundColor="green"
})
document.querySelector('#bluebtn1').addEventListener("click",()=>{
  document.body.style.backgroundColor="blue"
})
document.querySelector('#yellowbtn1').addEventListener("click",()=>{
  document.body.style.backgroundColor="yellow"
})
document.querySelector('#reset3').addEventListener("click", () => {

  document.body.style.backgroundColor = "";

  document.body.classList.remove("DarkTheme");
  document.body.classList.add("lightTheme");

});
</script>
<hr>
<input type="text" id="nameInput" placeholder="Enter your name">
  <button id="greetBtn">Greet Me</button>

  <h2 id="message"></h2>

  <script>
    document.querySelector("#greetBtn").addEventListener("click", () => {

      let name = document.querySelector("#nameInput").value;

      document.querySelector("#message").textContent =
        "Hello, " + name + "! Welcome ";

    });
  </script>
  <hr>


<input type="text" id="textInput">

<p>Character Count: <span id="charCount">0</span>/100</p>

<script>
  let input = document.querySelector("#textInput");
  let charCount = document.querySelector("#charCount");

  input.addEventListener("input", () => {
      if (input.value.length > 100) {
    alert("Maximum 100 characters allowed!");}
    charCount.textContent = input.value.length;
  });
</script>
<hr>
   
  <input type="text" id="itemInput" placeholder="Enter item">
  <button id="addBtn">Add</button>

  <h3>Items:</h3>
  <ul id="shopList"></ul>

  <script>
    let inputelmt = document.querySelector("#itemInput");
    let list = document.querySelector("#shopList");

    document.querySelector("#addBtn").addEventListener("click", () => {
        let li = document.createElement("li");
        li.textContent = inputelmt.value;
        list.appendChild(li);
        inputelmt.value = "";
    
    });
  </script>
   </body>
</html>
