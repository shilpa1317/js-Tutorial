<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Validation</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#654ed5;
    }
    .otp-card{
      width:400px;
      border:none;
      border-radius:18px;
    }
    .otp-input{
      width:65px;
      height:65px;
      font-size:22px;
      font-weight:bold;
      border-radius:12px;
    }
    .otp-box{
      width:95px;
      background:#fff;
      border:1px solid #ddd;
      border-radius:12px;
      padding:8px;
    }
  </style>
</head>

<body>


  <div class="position-absolute top-0 end-0 m-4 text-end">
    <button class="btn btn-primary btn-sm rounded-pill px-3 mb-2" id="generateOTP">
      Generate
    </button>

    <div class="otp-box shadow-sm text-center ms-auto">
      <small class="text-secondary d-block" style="font-size:10px;">OTP</small>
      <div class="fw-bold text-primary" style="font-size:18px; letter-spacing:2px;" id="otpinput">
        ----
      </div>
    </div>
  </div>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card otp-card shadow p-4">

      <h3 class="text-center fw-bold" style="color: blue;">OTP Verification</h3>
      <p class="text-center text-muted mb-4">
        Enter your 4-digit OTP
      </p>

      <div class="d-flex justify-content-between mb-4" id="button input">
        <input type="text" class="form-control text-center otp-input" id="inputOne" oninput="toNextInput('inputTwo')" maxlength="1">
        <input type="text" class="form-control text-center otp-input" id="inputTwo" oninput="toNextInput('inputThree')" maxlength="1">
        <input type="text" class="form-control text-center otp-input"id="inputThree" oninput="toNextInput('inputFour')"  maxlength="1">
        <input type="text" class="form-control text-center otp-input" id="inputFour" maxlength="1">
      </div>

      <button class="btn btn-success w-100 py-2 rounded-3" id="VerifyOtp">
        Verify OTP
      </button>

    </div>
  </div>
<script src="script.js"></script>
</body>
</html>
