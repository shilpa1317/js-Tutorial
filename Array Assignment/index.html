<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container p-3">
    <h1 class="display-4 text-center">1.To Do List Manager</h1>

    <div class="container w-50">

        <div class="input-group mb-3">

           <input type="text" id="inputTask" class="form-control m-2" placeholder="Enter Task" >

            <button id="addBtn" class="btn btn-primary me-2" onclick="addNewtask()">Add Task </button>

           <button class="btn btn-primary" onclick="clearAll()">
    Clear All
</button>

        </div>

        <ul id="Lists" class="list-group"></ul>

    </div>
</div>
<!-- 
//2 -->
<div class="container p-3">
        <h1 class="display-4 text-center">2. Student Marks Calculator
</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter the mark" id="inputMark">
                <button class="btn btn-primary me-2" onclick="addmark()">Add Mark</button>
                <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                <button class="btn btn-primary" onclick="reset()">Reset</button>
            </div>
            <ul id="markList" class="list-group mb-3"></ul>

    <div id="result"></div>
            </div>

<!-- //3 -->
<div class="container p-3">
        <h1 class="display-4 text-center">3. Search in an Array
</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter the name" id="inputname">
                <button class="btn btn-primary me-2" onclick="search()">Search</button>
                
            </div>
            <ul id="carkList" class="list-group mb-3"></ul>
            <div id="resultC"></div>

   
            </div>


<!-- 4 -->
 <div class="container p-3">
        <h1 class="display-4 text-center">4.Filter Even and Odd Numbers
</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter the mark" id="inputnum">
                <button class="btn btn-primary me-2" onclick="addnumber()">Add Number</button>
                <button class="btn btn-primary" onclick="showeven()">Even</button>
                <button class="btn btn-primary" onclick="showodd()">Odd</button>
                <button class="btn btn-primary" onclick="clear()">Clear</button>
            </div>
            <ul id="numList" class="list-group mb-3"></ul>

    <div id="result4"></div>
    <h2>Even Numbers</h2>
            <div id="even"></div>
            <h2>Odd Numbers</h2>
            <div id="Odd"></div>
            </div>















<!-- //5 -->

 <div class="container p-3">
        <h1 class="display-4 text-center">5. Sort Names Alphabetically
</h1>
        <div class="container w-50">
            <div class="input-group mb-3">
                <input type="text" class="form-control me-2" placeholder="Enter Task" id="inputName">
                <button class="btn btn-primary me-2" onclick="addNewName()">Add Name</button>
                <button class="btn btn-primary" onclick="SortArray()">Sort</button>
                <button class="btn btn-primary" onclick="clearNames()">Clear All</button>
            </div>
            <h2>Unsorted Names</h2>
            <div id="unSortedName"></div>
            <h2>Sorted Names</h2>
            <div id="sortedName"></div>
        </div>
</div>









<script src="array.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
